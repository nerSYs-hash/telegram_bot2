name: CI lint & tests

# V1.17.0O3: GitHub Action — ловит скрытые баги при push.
# Зеркало pre-commit hook'а + полный прогон тестов.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff (pyflakes + bugbear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Ruff check
        run: ruff check .

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt || true
          # Минимальный набор для тестов если requirements неполный
          pip install pytest pytest-asyncio httpx aiosqlite python-telegram-bot \
                      fastapi pyjwt openpyxl uvicorn pydantic python-dotenv \
                      Pillow opencv-python-headless
      - name: Run tests
        env:
          BOT_TOKEN: "test-token-for-ci"
          JWT_SECRET: "test-jwt-secret"
        run: |
          # Исключаем economy_routes_multi_ws (нужны полные деп-и которые
          # не ставим в CI; запускаем локально)
          pytest tests/ -q --ignore=tests/test_economy_routes_multi_ws.py
