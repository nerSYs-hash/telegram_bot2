name: Deploy Bot

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Bot via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/PulsBot
            # ─── БЭКАП БД ───
            mkdir -p /root/db_backup
            cp -f pulse_bot.db               /root/db_backup/pulse_bot.db        2>/dev/null || true
            cp -f bot_database.db            /root/db_backup/bot_database.db     2>/dev/null || true
            cp -f database.db                /root/db_backup/database.db         2>/dev/null || true
            cp -f Site/backend/pulse_site.db /root/db_backup/pulse_site.db       2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            # ─── ВОССТАНОВЛЕНИЕ БД ───
            cp -f /root/db_backup/pulse_bot.db        pulse_bot.db               2>/dev/null || true
            cp -f /root/db_backup/bot_database.db     bot_database.db            2>/dev/null || true
            cp -f /root/db_backup/database.db         database.db                2>/dev/null || true
            cp -f /root/db_backup/pulse_site.db       Site/backend/pulse_site.db 2>/dev/null || true
            source venv/bin/activate
            pip install -r requirements.txt -q
            systemctl restart pulsbot
            echo "✅ Bot deployed!"
