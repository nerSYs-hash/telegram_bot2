name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  #  JOB 1: БОТ — срабатывает на изменения Python/бота
  # ─────────────────────────────────────────────
  deploy-bot:
    runs-on: ubuntu-latest
    if: |
      contains(toJson(github.event.commits), '.py') ||
      contains(toJson(github.event.commits), 'requirements.txt')

    steps:
      - name: Deploy Bot via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/PulsBot
            # ─── БЭКАП БД ───
            mkdir -p /root/db_backup
            cp -f pulse_bot.db                     /root/db_backup/pulse_bot.db                     2>/dev/null || true
            cp -f bot_database.db                  /root/db_backup/bot_database.db                  2>/dev/null || true
            cp -f database.db                      /root/db_backup/database.db                      2>/dev/null || true
            cp -f registration_system/pulse_bot.db /root/db_backup/registration_system_pulse_bot.db 2>/dev/null || true
            cp -f Site/backend/pulse_site.db       /root/db_backup/pulse_site.db                    2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            # ─── ВОССТАНОВЛЕНИЕ БД ───
            cp -f /root/db_backup/pulse_bot.db                     pulse_bot.db                     2>/dev/null || true
            cp -f /root/db_backup/bot_database.db                  bot_database.db                  2>/dev/null || true
            cp -f /root/db_backup/database.db                      database.db                      2>/dev/null || true
            cp -f /root/db_backup/registration_system_pulse_bot.db registration_system/pulse_bot.db 2>/dev/null || true
            cp -f /root/db_backup/pulse_site.db                    Site/backend/pulse_site.db       2>/dev/null || true
            source venv/bin/activate
            pip install -r requirements.txt -q
            systemctl restart pulsbot
            echo "✅ Bot deployed!"

  # ─────────────────────────────────────────────
  #  JOB 2: САЙТ — срабатывает на изменения Admin_SITE или api.py
  # ─────────────────────────────────────────────
  deploy-site:
    runs-on: ubuntu-latest
    if: |
      contains(toJson(github.event.commits), 'Admin_SITE') ||
      contains(toJson(github.event.commits), 'api.py')

    steps:
      - name: Deploy Admin Site via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/PulsBot
            git fetch origin main
            git reset --hard origin/main
            # ─── СБОРКА React ───
            cd /root/PulsBot/Admin_SITE
            npm install --silent
            npm run build
            cd /root/PulsBot
            # ─── РЕСТАРТ API ───
            systemctl restart pulsapi
            systemctl reload nginx
            echo "✅ Admin Site deployed!"
