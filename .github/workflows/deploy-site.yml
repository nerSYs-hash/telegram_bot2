name: Deploy Admin Site

on:
  push:
    branches: [main]
    paths:
      - 'Admin_SITE/**'
      - 'api.py'
      - 'deploy/nginx_puls-chat.conf'
      - '.github/workflows/deploy-site.yml'

jobs:
  deploy-site:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Admin Site via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/PulsBot
            git fetch origin main
            git reset --hard origin/main
            # ─── dist собирается локально, просто даём права ───
            chmod -R o+rX /root/PulsBot/Admin_SITE/dist
            # ─── РЕСТАРТ API + NGINX ───
            systemctl restart pulsapi
            systemctl reload nginx
            sleep 3
            # ─── ГЕНЕРАЦИЯ ЗАМЕТКИ ОБ ОБНОВЛЕНИИ ───
            COMMIT_MSG=$(git log -1 --pretty=%s)
            curl -s -X POST http://localhost:8000/api/updates/generate \
              -H "Content-Type: application/json" \
              -d "{\"commit_message\": \"$COMMIT_MSG\", \"secret\": \"pulse-deploy-secret\"}" || true
            echo "✅ Admin Site deployed!"
