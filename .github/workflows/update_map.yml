name: Auto-Update Project Map

# Воркфлоу запускается на push в main с изменениями кода (.py/.js/.jsx),
# генерирует Pulse_Auto_Map.xlsx и кладёт его в Artifacts текущего запуска.
# Скачать: Actions → Auto-Update Project Map → последний run → внизу Artifacts.
# Файл намеренно НЕ коммитится в репо — git pull тогда не сталкивается с
# открытым Excel, который держит файл заблокированным под Windows.

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.js'
      - '**.jsx'
  workflow_dispatch:

jobs:
  update-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код проекта
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем openpyxl
        run: pip install openpyxl

      - name: Запускаем сканер
        run: python scanner_to_excel.py

      - name: Загружаем карту как Artifact (90 дней)
        if: hashFiles('Pulse_Auto_Map.xlsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Pulse_Auto_Map
          path: Pulse_Auto_Map.xlsx
          retention-days: 90

      - name: Отправка файла в Telegram (если настроены секреты)
        if: hashFiles('Pulse_Auto_Map.xlsx') != ''
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -F document=@"Pulse_Auto_Map.xlsx" \
                 -F caption="✅ Карта проекта PULSE обновлена" \
                 https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}
          else
            echo "ℹ️ Telegram-секреты не настроены — отправка пропущена"
          fi
