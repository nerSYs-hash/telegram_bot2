name: Auto-Update Project Map

# Воркфлоу запускается на push в main с изменениями кода (.py/.js/.jsx),
# генерирует Pulse_Auto_Map.xlsx и коммитит его ОБРАТНО в main с маркером
# [skip ci] — чтобы Илья получал свежий файл одним `git pull`, без отдельной
# ветки. [skip ci] предотвращает рекурсивный запуск воркфлоу.

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.js'
      - '**.jsx'
  workflow_dispatch:

jobs:
  update-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # право пушить карту обратно в main
    steps:
      - name: Скачиваем код проекта (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем openpyxl
        run: pip install openpyxl

      - name: Запускаем сканер
        run: python scanner_to_excel.py

      - name: Коммитим карту обратно в main
        run: |
          git config --global user.name  "Pulse Bot Auto-Scanner"
          git config --global user.email "scanner@pulse.bot"

          if [ ! -f "Pulse_Auto_Map.xlsx" ]; then
            echo "⚠️ Файл Pulse_Auto_Map.xlsx не был создан"
            exit 0
          fi

          git add Pulse_Auto_Map.xlsx
          if git diff --staged --quiet; then
            echo "Карта без изменений — коммит не нужен"
          else
            git commit -m "🗺 Карта проекта PULSE [skip ci]"
            git push origin main
          fi

      - name: Отправка файла в Telegram
        run: |
          if [ -f "Pulse_Auto_Map.xlsx" ]; then
            curl -F document=@"Pulse_Auto_Map.xlsx" \
                 -F caption="✅ Карта проекта **PULSE** обновлена!" \
                 -F parse_mode="Markdown" \
                 https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}
          else
            echo "⚠️ Файл для отправки не найден"
          fi
