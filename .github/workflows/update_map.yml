
name: Auto-Update Project Map

# Запускать скрипт автоматически каждый раз, когда меняются файлы кода
on:
  push:
    paths:
      - '**.py'
      - '**.js'
      - '**.jsx'

jobs:
  update-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем право сохранять файл в репозиторий

    steps:
      - name: Скачиваем код проекта
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Работает на любой стабильной версии

      - name: Устанавливаем библиотеку openpyxl
        run: pip install openpyxl

      - name: Запускаем наш сканер
        run: python scanner_to_excel.py # Убедись, что файл сканера называется именно так

      - name: Сохраняем новый Excel в GitHub
        run: |
          git config --global user.name "Pulse Bot Auto-Scanner"
          git config --global user.email "scanner@pulse.bot"
          git add Pulse_Auto_Map.xlsx
          
          # Проверяем, изменился ли файл. Если да - сохраняем (commit) и отправляем (push)
          git diff --quiet && git diff --staged --quiet || (git commit -m "🗺 Авто-обновление карты проекта (Excel)" && git push)
          ```